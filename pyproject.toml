[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multichain-wallet"
version = "1.0.0"
description = "Multi-chain cryptocurrency wallet balance checker — query ETH, SOL, BTC, and 20+ EVM chains in one command."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "adityasaksianarki", email = "tuyulbumiayu4@gmail.com"},
]
keywords = ["crypto", "wallet", "blockchain", "multi-chain", "balance", "evm", "solana", "bitcoin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28",
    "web3>=6.0",
    "base58>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
multichain = "multichain_wallet.cli:main"

[project.urls]
Homepage = "https://github.com/adityasaksianarki/multi-chain-wallet-checker"
Repository = "https://github.com/adityasaksianarki/multi-chain-wallet-checker"
Issues = "https://github.com/adityasaksianarki/multi-chain-wallet-checker/issues"
